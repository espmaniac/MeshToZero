        fill="none" stroke="#5A5A5A" stroke-width="2.35"
        stroke-linecap="round"/>
  <path d="M103.5 39.2 A59.5 12.5 0 0 1 127.5 49"
        fill="none" stroke="#5A5A5A" stroke-width="2.35"
        stroke-linecap="round"/>

