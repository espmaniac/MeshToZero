<svg xmlns="http://www.w3.org/2000/svg"
  width="134" height="82" viewBox="0 0 134 82"
  shape-rendering="geometricPrecision">
  <title>MeshToZero 1:1 vector logo</title>
  <desc>Fully vector reconstruction matching the supplied reference.</desc>

  <!-- Rear half of the closed CAD rotation ring -->
